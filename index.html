<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💍 وەفا & ئاکۆ 💍</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:url('https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1600&auto=format&fit=crop') center center/cover no-repeat;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
}

.card{
position:relative;
z-index:2;
width:100%;
max-width:600px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(15px);
padding:30px;
border-radius:30px;
text-align:center;
color:white;
border:1px solid rgba(255,255,255,.2);
}

h1{
font-size:48px;
margin-bottom:20px;
}

.info{
font-size:22px;
margin:15px 0;
line-height:1.8;
}

.welcome{
font-size:28px;
font-weight:bold;
margin:25px 0;
line-height:1.6;
}

#countdown{
font-size:30px;
font-weight:bold;
color:#ffd54f;
margin:25px 0;
}

.playBtn{
width:100%;
padding:16px;
border:none;
border-radius:20px;
background:#ffd54f;
font-size:22px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

.mapBtn{
display:block;
margin-top:15px;
padding:16px;
background:white;
color:black;
text-decoration:none;
border-radius:20px;
font-size:18px;
font-weight:bold;
line-height:1.7;
}

.footer{
margin-top:25px;
font-size:20px;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="card">

<h1>💍 وەفا & ئاکۆ 💍</h1>

<div class="welcome">
❤️ بەخێربێن بۆ ئاهەنگی هاوسەرگیریمان ❤️
</div>

<div class="info">
📅 20 / 09 / 2026
</div>

<div class="info">
🕗 8:00 PM
</div>

<div class="info">
📍 شوێن / رۆیال ڤێلا / شەقامی ١٥٠ مەتری / نزیک مزرەعەی شێخ باز / ڕێگای شەقڵاوە
</div>

<div id="countdown"></div>

<button class="playBtn" onclick="playMusic()">
🎵 گۆرانی دەستپێبکە
</button>

<a class="mapBtn"
href="https://maps.google.com/?q=36.248158,44.114311"
target="_blank">
📍 شوێنی ئاهەنگ
</a>

<div class="footer">
❤️ لەگەڵ خۆشەویستی
</div>

<audio id="music" loop>
<source src="buke.mp3" type="audio/mpeg">
</audio>

</div>

<script>

function playMusic(){
document.getElementById("music").play();
}

var countDownDate =
new Date("Sep 20, 2026 20:00:00").getTime();

setInterval(function(){

var now = new Date().getTime();

var distance = countDownDate - now;

var days =
Math.floor(distance/(1000*60*60*24));

var hours =
Math.floor((distance%(1000*60*60*24))/(1000*60*60));

var minutes =
Math.floor((distance%(1000*60*60))/(1000*60));

document.getElementById("countdown").innerHTML =
"⏳ " + days + " ڕۆژ  •  " +
hours + " کاتژمێر  •  " +
minutes + " خولەک";

},1000);

</script>

</body>
</html>
