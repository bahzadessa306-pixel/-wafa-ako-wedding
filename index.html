<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وەفا & ئاکۆ</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:url("https://images.unsplash.com/photo-1511285560929-80b456fea0bc?q=80&w=1200") center/cover no-repeat;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.45);
}

.card{
position:relative;
z-index:2;
width:100%;
max-width:500px;
background:rgba(255,255,255,0.12);
backdrop-filter:blur(10px);
border-radius:30px;
padding:30px;
text-align:center;
color:white;
border:1px solid rgba(255,255,255,0.2);
}

h1{
font-size:48px;
margin-bottom:20px;
}

.info{
font-size:24px;
margin:15px 0;
}

.welcome{
font-size:28px;
font-weight:bold;
margin:30px 0;
line-height:1.6;
}

#countdown{
font-size:32px;
font-weight:bold;
margin-top:25px;
color:#ffd700;
}

.btn{
display:inline-block;
margin-top:25px;
padding:12px 25px;
background:#d4af37;
color:white;
text-decoration:none;
border-radius:15px;
font-size:20px;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="card">

<h1>💍 وەفا & ئاکۆ 💍</h1>

<div class="info">📅 20/09/2026</div>
<div class="info">🕗 8:00 PM</div>
<div class="info">📍 شەقڵاوە</div>

<div class="welcome">
بەخێربێن بۆ ئاهەنگی هاوسەرگیریمان ❤️
</div>

<div id="countdown"></div>

<a class="btn" href="#">📍 شوێنی ئاهەنگ</a>

</div>

<script>
var countDownDate = new Date("Sep 20, 2026 20:00:00").getTime();

setInterval(function() {

var now = new Date().getTime();
var distance = countDownDate - now;

var days = Math.floor(distance / (1000*60*60*24));
var hours = Math.floor((distance % (1000*60*60*24)) / (1000*60*60));
var minutes = Math.floor((distance % (1000*60*60)) / (1000*60));

document.getElementById("countdown").innerHTML =
"⏳ " + days + " ڕۆژ " + hours + " کاتژمێر " + minutes + " خولەک";

},1000);
</script>

</body>
</html>
