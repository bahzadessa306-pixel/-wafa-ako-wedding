<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>وەفا & ئاکۆ 💍</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:url('https://images.unsplash.com/photo-1511285560929-80b456fea0bc?q=80&w=1600&auto=format&fit=crop') center center/cover no-repeat;
height:100vh;
overflow:hidden;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
}

.enterScreen{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
}

.enterCard{
width:90%;
max-width:420px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
padding:30px;
border-radius:30px;
text-align:center;
color:white;
border:1px solid rgba(255,255,255,.2);
}

.enterCard h1{
font-size:40px;
margin-bottom:15px;
}

.enterBtn{
margin-top:20px;
padding:15px 35px;
border:none;
border-radius:50px;
background:#ffd54f;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

.main{
display:none;
height:100vh;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
width:100%;
max-width:500px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(12px);
padding:25px;
border-radius:30px;
text-align:center;
color:white;
border:1px solid rgba(255,255,255,.2);
}

h2{
font-size:42px;
margin-bottom:15px;
}

.info{
font-size:22px;
margin:12px 0;
}

.welcome{
font-size:28px;
font-weight:bold;
margin:25px 0;
line-height:1.5;
}

#countdown{
font-size:30px;
font-weight:bold;
color:#ffd54f;
margin-top:25px;
}

.mapBtn{
display:block;
margin-top:20px;
padding:15px;
background:white;
color:black;
text-decoration:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
}

.footer{
margin-top:20px;
font-size:18px;
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="enterScreen" id="enterScreen">

<div class="enterCard">

<h1>💍 وەفا & ئاکۆ 💍</h1>

<p>بەخێربێن بۆ بانگهێشتنامەی هاوسەرگیریمان ❤️</p>

<button class="enterBtn" onclick="enterWedding()">
❤️ چوونە ژوورەوە
</button>

</div>

</div>

<div class="main" id="main">

<div class="card">

<h2>💍 وەفا & ئاکۆ 💍</h2>

<div class="info">📅 20/09/2026</div>

<div class="info">🕗 8:00 PM</div>

<div class="info">📍 شەقڵاوە</div>

<div class="welcome">
❤️ بەخێربێن بۆ ئاهەنگی هاوسەرگیریمان ❤️
</div>

<div id="countdown"></div>

<a class="mapBtn"
href="https://maps.google.com"
target="_blank">
📍 شوێنی ئاهەنگ
</a>

<div class="footer">
لەگەڵ خۆشەویستی ❤️
</div>

<audio id="music" loop>
<source src="buke.mp3" type="audio/mpeg">
</audio>

</div>

</div>

<script>

function enterWedding(){

document.getElementById("enterScreen").style.display="none";

document.getElementById("main").style.display="flex";

document.getElementById("music").play();

}

var countDownDate =
new Date("Sep 20, 2026 20:00:00").getTime();

setInterval(function(){

var now = new Date().getTime();

var distance = countDownDate - now;

var days =
Math.floor(distance/(1000*60*60*24));

var hours =
Math.floor((distance%(1000*60*60*24))/(1000*60*60));

var minutes =
Math.floor((distance%(1000*60*60))/(1000*60));

document.getElementById("countdown").innerHTML =
"⏳ " +
days +
" ڕۆژ " +
hours +
" کاتژمێر " +
minutes +
" خولەک";

},1000);

</script>

</body>
</html>
