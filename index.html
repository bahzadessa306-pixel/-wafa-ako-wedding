<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وەفا & ئاکۆ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url("https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1600&q=80")
  center/cover fixed;
  color: white;
  text-align: center;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(20, 5, 30, 0.65);
  z-index: -1;
}

.welcome {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.welcome h1 {
  font-size: 42px;
  text-shadow: 0 0 20px #ffb6d9;
}

button {
  padding: 18px 35px;
  border: none;
  border-radius: 50px;
  background: linear-gradient(45deg, #ffd700, #ff8acb);
  color: white;
  font-size: 20px;
  cursor: pointer;
  box-shadow: 0 0 30px rgba(255, 200, 100, 0.8);
}

.card {
  display: none;
  max-width: 500px;
  margin: 50px auto;
  padding: 35px 25px;
  border-radius: 30px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(15px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  animation: show 1.5s ease;
}

@keyframes show {
  from {
    transform: scale(0.5) rotateX(40deg);
    opacity: 0;
  }
  to {
    transform: scale(1) rotateX(0);
    opacity: 1;
  }
}

h2 {
  font-size: 40px;
  color: #ffd700;
}

.info {
  margin: 18px 0;
  font-size: 19px;
  line-height: 1.8;
}

.countdown {
  font-size: 24px;
  margin: 25px 0;
  color: #ffd700;
}

.musicBox {
  margin-top: 25px;
}

/* ئەگەر نەتەوێت ڤیدیۆکە ببینرێت */
.musicBox iframe {
  width: 100%;
  height: 80px;
  border-radius: 15px;
}

.balloons {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: -1;
}

.balloon {
  position: absolute;
  bottom: -150px;
  width: 70px;
  height: 90px;
  border-radius: 50%;
  animation: fly 12s linear infinite;
  box-shadow: inset -10px -10px 20px rgba(0,0,0,.2),
              0 0 20px rgba(255,255,255,.3);
}

.balloon::after {
  content: "";
  position: absolute;
  width: 2px;
  height: 100px;
  background: rgba(255,255,255,.7);
  left: 50%;
  top: 88px;
}

.b1 { left: 10%; background: #ff5c8a; animation-delay: 0s; }
.b2 { left: 25%; background: #ffd700; animation-delay: 3s; }
.b3 { left: 45%; background: #7dd3fc; animation-delay: 6s; }
.b4 { left: 65%; background: #c084fc; animation-delay: 2s; }
.b5 { left: 80%; background: #fb7185; animation-delay: 5s; }

@keyframes fly {
  0% {
    transform: translateY(0) rotate(-8deg);
  }

  50% {
    transform: translateY(-55vh) rotate(8deg);
  }

  100% {
    transform: translateY(-120vh) rotate(-8deg);
  }
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="balloons">
  <div class="balloon b1"></div>
  <div class="balloon b2"></div>
  <div class="balloon b3"></div>
  <div class="balloon b4"></div>
  <div class="balloon b5"></div>
</div>

<div class="welcome" id="welcome">

  <h1>💍 وەفا & ئاکۆ 💍</h1>

  <button onclick="enterSite()">
    💍 چوونە ژوورەوە
  </button>

</div>

<div class="card" id="card">

  <h2>💍 وەفا & ئاکۆ 💍</h2>

  <div class="info">
    📅 20/09/2026
  </div>

  <div class="info">
    🕗 8:00 PM
  </div>

  <div class="info">
    📍 <strong>شوێن</strong><br>
    رۆیال ڤێلا<br>
    شەقامی ١٥٠ مەتری نزیک مزرەعەی شێخ باز<br>
    رێگای شەقلاوە
  </div>

  <div class="info">
    ❤️ بەخێربێن بۆ ئاهەنگی هاوسەرگیریمان ❤️
  </div>

  <div class="countdown" id="countdown"></div>

  <div class="musicBox">

    <iframe
      id="youtubeMusic"
      src="https://www.youtube.com/embed/ifUe7047Ro0?enablejsapi=1&autoplay=0"
      frameborder="0"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>

  </div>

</div>

<script>

function enterSite() {

  // شاردنەوەی پەڕەی بەخێرهاتن
  document.getElementById("welcome").style.display = "none";

  // پیشاندانی کارتەکە
  document.getElementById("card").style.display = "block";

  // دەستپێکردنی گۆرانی
  var iframe = document.getElementById("youtubeMusic");

  iframe.contentWindow.postMessage(
    JSON.stringify({
      event: "command",
      func: "playVideo",
      args: []
    }),
    "*"
  );
}


// Countdown
var target = new Date("September 20, 2026 20:00:00").getTime();

setInterval(function() {

  var now = new Date().getTime();

  var distance = target - now;

  if (distance <= 0) {
    document.getElementById("countdown").innerHTML =
      "🎉 کاتی ئاهەنگەکە گەیشت! 🎉";
    return;
  }

  var days = Math.floor(
    distance / (1000 * 60 * 60 * 24)
  );

  var hours = Math.floor(
    (distance % (1000 * 60 * 60 * 24))
    / (1000 * 60 * 60)
  );

  var minutes = Math.floor(
    (distance % (1000 * 60 * 60))
    / (1000 * 60)
  );

  var seconds = Math.floor(
    (distance % (1000 * 60))
    / 1000
  );

  document.getElementById("countdown").innerHTML =
    "⏳ " +
    days + " ڕۆژ " +
    hours + " کاتژمێر " +
    minutes + " خولەک " +
    seconds + " چرکە";

}, 1000);

</script>

</body>
</html>
